{{define "scripts"}}
<script src="/static/playback.js" defer></script>
<script src="/static/practice.js" defer></script>
{{end}}

{{define "content"}}
<section class="practice-page">
  <a href="/catalog" class="back-link muted small">← Catalog</a>
  <div class="player" id="player">
    <div class="screen">
      <div id="yt-player"></div>
      <img id="cover" class="cover" alt="" hidden>
      <div class="screen-overlay" id="screen-message" hidden></div>
    </div>

    <div class="now-playing">
      <div class="np-title">{{with .Song.Title}}{{.}}{{else}}Untitled{{end}}</div>
      <div class="np-author muted">{{.Song.Author}}</div>
    </div>

    <div class="transport">
      <button type="button" id="play-pause" class="transport-button" aria-label="Play" disabled>▶</button>
      <span class="time" id="time-current">0:00</span>
      <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="Position" disabled>
      <span class="time" id="time-total">0:00</span>
    </div>

    <div class="tools card" id="tools" hidden>
      <canvas id="waveform" class="waveform" aria-label="Waveform: click to seek, drag to pick a loop"></canvas>
      <div class="tool-row">
        <button type="button" class="small" id="set-a" title="Start the loop here">Set A</button>
        <button type="button" class="small" id="set-b" title="End the loop here">Set B</button>
        <button type="button" class="small toggle" id="loop-toggle" aria-pressed="false">Loop</button>
        <span class="muted small" id="loop-range">No loop</span>
        <button type="button" class="link small" id="loop-clear" hidden>Clear</button>
        <label class="small tool-push">Count-in
          <select id="count-in">
            <option value="0">Off</option>
            <option value="1">1 s</option>
            <option value="2">2 s</option>
            <option value="3">3 s</option>
          </select>
        </label>
      </div>
    </div>

    <div class="mixer card" id="mixer" aria-label="Tracks" hidden></div>
  </div>
</section>

{{template "track-template"}}
<script type="application/json" id="song-data">{{.Song}}</script>
{{end}}
